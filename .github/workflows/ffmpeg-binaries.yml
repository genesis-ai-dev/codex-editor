name: FFmpeg binary compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/utils/ffmpeg*.ts"
      - "src/utils/toolsManager.ts"
      - "src/exportHandler/characterAudio*.ts"
      - "src/test/suite/audio/ffmpeg*.test.ts"
      - "scripts/test-ffmpeg.cjs"
      - ".github/workflows/ffmpeg-binaries.yml"

permissions:
  contents: read

jobs:
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-ffmpeg.cjs --smoke
